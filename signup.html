<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriGuard AI | Request a Demo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.prod.website-files.com/67ee63cb3895632eb840c962/logo.png" rel="shortcut icon" type="image/png" />
    <link href="https://cdn.prod.website-files.com/67ee63cb3895632eb840c962/logo.png" rel="apple-touch-icon" />
</head>
<body>
    <main class="container">
        <section class="form-section">
            <div class="brand">
                <img src="cdn.prod.website-files.com/67ee63cb3895632eb840c962/logo.png" alt="Forest Restored A.I. Logo" class="logo-img">
            </div>

            <div class="content-wrapper">
                <h1>Request a Demo</h1>

                <form class="signup-form">
                    <div class="input-row">
                        <div class="input-group">
                            <label>First Name *</label>
                            <input type="text" placeholder="First Name" required>
                        </div>
                        <div class="input-group">
                            <label>Last Name *</label>
                            <input type="text" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Email *</label>
                        <input type="email" placeholder="Email" required>
                    </div>

                    <div class="input-group">
                        <label>Company Name *</label>
                        <input type="text" placeholder="Company Name" required>
                    </div>

                    <div class="input-group">
                        <label>Job Title *</label>
                        <input type="text" placeholder="Job Title" required>
                    </div>

                    <div class="input-group">
                        <label>Please Select Your Country *</label>
                        <select class="select-field" required>
                            <option value="">Select Country</option>
                            <option value="us">United States</option>
                            <option value="uk">United Kingdom</option>
                            <option value="ca">Canada</option>
                            <option value="au">Australia</option>
                            <option value="za">South Africa</option>
                            <option value="ke">Kenya</option>
                            <option value="ng">Nigeria</option>
                            <option value="gh">Ghana</option>
                            <option value="tz">Tanzania</option>
                            <option value="ug">Uganda</option>
                            <option value="et">Ethiopia</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Products Interested In *</label>
                        <div class="checkbox-group" id="products-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="products" value="trial-management">
                                <span>Trial Management</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="products" value="crop-advisor">
                                <span>Crop Advisor</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="products" value="insights">
                                <span>Insights</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="products" value="sustainability">
                                <span>Sustainability</span>
                            </label>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Message</label>
                        <textarea placeholder="Message" rows="4"></textarea>
                    </div>

                    <div class="input-group checkbox-field">
                        <label class="checkbox-label">
                            <input type="checkbox" required>
                            <span>I agree to receive marketing communications from Forest Restored A.I. *</span>
                        </label>
                    </div>

                    <div class="input-group checkbox-field">
                        <label class="checkbox-label">
                            <input type="checkbox" required>
                            <span>I understand that my information will be used according to the Privacy Policy. *</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">Submit</button>
                </form>
            </div>
        </section>

        <section class="image-section">
            <div class="image-carousel">
                <div class="carousel-slide active" style="background-image: url('cdn.prod.website-files.com/67ee63cb3895632eb840c962/farm1.jpeg')"></div>
                <div class="carousel-slide" style="background-image: url('cdn.prod.website-files.com/67ee63cb3895632eb840c962/solar1.jpeg')"></div>
                <div class="carousel-slide" style="background-image: url('cdn.prod.website-files.com/67ee63cb3895632eb840c962/solution.jpeg')"></div>
                <div class="carousel-slide" style="background-image: url('cdn.prod.website-files.com/67ee63cb3895632eb840c962/solar2.jpeg')"></div>
            </div>
            <div class="testimonial-overlay">
                <blockquote>
                    "AgriGuard AI is building a future where real farm data becomes the foundation of crop protection, fair financing, and climate-resilient agriculture."
                </blockquote>
                <div class="pagination">
                    <span class="dot active" data-slide="0"></span>
                    <span class="dot" data-slide="1"></span>
                    <span class="dot" data-slide="2"></span>
                    <span class="dot" data-slide="3"></span>
                </div>
            </div>
        </section>
    </main>
</body>

    padding: 0;
}


.container {

    width: 100%;
    overflow-x: hidden;

body {

    overflow-y: auto;

/* Left Column */

    flex: 1;
    padding: 40px 80px;
    display: flex;

    overflow-y: auto;
    overflow-x: hidden;
    min-height: 100vh;

}

.brand {

}

.logo-img {
    height: 120px;
    width: auto;
    max-width: 400px;

.content-wrapper {
    max-width: 480px;

h1 {

    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 30px;

    margin-top: 20px;
}

.input-row {

    gap: 15px;
}

.input-group {
    margin-bottom: 20px;
    flex: 1;
}

.input-group.checkbox-field {
    margin-bottom: 15px;
}

label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--text-light);
}

input[type="text"],
input[type="email"],
input[type="password"],
select,
textarea {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background-color: var(--bg-gray);
    font-size: 0.9rem;

}

select.select-field {

textarea {

}

.checkbox-group {

    gap: 12px;
    margin-top: 8px;

    border: none;
    border-radius: 50px;

    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.35s cubic-bezier(0.645, 0.045, 0.355, 1);

.btn-primary:hover {

/* Right Column - Image Carousel */
.image-section {
    flex: 1;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 60px;
    color: white;
    overflow: hidden;
    min-height: 100vh;
    width: 100%;
}

.image-carousel {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.carousel-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1s ease-in-out;
}

.carousel-slide.active {
    opacity: 1;
}

.image-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(3, 89, 37, 0.4) 0%, rgba(0, 44, 17, 0.6) 50%, rgba(0, 0, 0, 0.8) 100%);
    z-index: 1;
}

.testimonial-overlay {
    position: relative;
    z-index: 2;
    max-width: 400px;
}

blockquote {

    font-weight: 500;
    margin-bottom: 10px;

cite {

    font-size: 0.9rem;
    opacity: 0.8;

.pagination {

    gap: 8px;
    margin-top: 20px;

.dot {

    height: 8px;
    border-radius: 50%;

</style>

<script>
    // Auto-scrolling image carousel
    let currentSlide = 0;
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.dot');
    const totalSlides = slides.length;

    function showSlide(index) {
        // Remove active class from all slides and dots
        slides.forEach(slide => slide.classList.remove('active'));
        dots.forEach(dot => dot.classList.remove('active'));
        
        // Add active class to current slide and dot
        slides[index].classList.add('active');
        dots[index].classList.add('active');
    }

    function nextSlide() {
        currentSlide = (currentSlide + 1) % totalSlides;
        showSlide(currentSlide);
    }

    // Auto-advance slides every 5 seconds
    setInterval(nextSlide, 5000);

    // Click on dots to navigate
    dots.forEach((dot, index) => {
        dot.addEventListener('click', () => {
            currentSlide = index;
            showSlide(currentSlide);
        });
    });

    // Initialize first slide
    showSlide(0);

    // Form validation for products checkboxes
    const form = document.querySelector('.signup-form');
    const productCheckboxes = document.querySelectorAll('input[name="products"]');

    form.addEventListener('submit', function(e) {
        const atLeastOneChecked = Array.from(productCheckboxes).some(cb => cb.checked);
        
        if (!atLeastOneChecked) {
            e.preventDefault();
            alert('Please select at least one product you are interested in.');
            return false;
        }
    });
    
    // Remove Webflow badge if it appears
    (function() {
        function removeWebflowBadge() {
            const badge = document.querySelector('.w-webflow-badge');
            if (badge) {
                badge.remove();
            }
        }
        // Remove immediately and also watch for dynamically added badge
        removeWebflowBadge();
        setInterval(removeWebflowBadge, 100);
        // Also use MutationObserver to catch it when added
        const observer = new MutationObserver(removeWebflowBadge);
        observer.observe(document.body, { childList: true, subtree: true });
    })();
</script>

</html>
